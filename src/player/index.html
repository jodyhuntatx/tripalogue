<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripAlogue player</title>
  <style>
    :root { color-scheme: dark; --bg: #0d0f13; --panel: #161a21; --line: #2a303a; --text: #e8eaee; --muted: #9aa1ad; --accent: #4f9cf7; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px 10px; }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; }
    header .meta { color: var(--muted); font-size: 13px; }
    #telemetry-badge { margin-left: auto; font-size: 12px; color: #f2c46d; border: 1px solid #5a4a24; border-radius: 999px; padding: 2px 10px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; padding: 0 20px 20px; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
    #stage-wrap { position: relative; width: 100%; max-height: calc(100vh - 170px); margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
    #stage { display: block; width: 100%; height: 100%; cursor: pointer; }
    .controls { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
    button:hover { border-color: #3c4554; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #play { min-width: 76px; font-weight: 600; }
    #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }
    .scrub-wrap { position: relative; flex: 1; height: 28px; display: flex; align-items: center; }
    #scrub { width: 100%; accent-color: var(--accent); }
    #marks { position: absolute; inset: 0; pointer-events: none; }
    #marks .chapter-mark { position: absolute; top: 3px; width: 3px; height: 8px; padding: 0; border: 0; border-radius: 1px; background: var(--muted); pointer-events: auto; transform: translateX(-1px); }
    #marks .chapter-mark.current { background: var(--accent); }
    #chapter { margin-top: 8px; color: var(--muted); min-height: 20px; }
    aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; align-self: start; }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
    #chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    #chapters button { width: 100%; text-align: left; border-color: transparent; background: transparent; }
    #chapters button.current { border-color: var(--line); background: #1d232c; color: #fff; }
    #status { color: var(--muted); margin-left: 4px; }
    body[data-state="error"] #status { color: #ff8a80; }
    .keys { margin-top: 12px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body data-state="loading">
  <header>
    <h1 id="title">TripAlogue</h1>
    <span class="meta" id="meta"></span>
    <span id="status" role="status" aria-live="polite"></span>
    <span id="telemetry-badge" hidden>Session recording on</span>
  </header>
  <main>
    <section>
      <div id="stage-wrap"><canvas id="stage" aria-label="Travelogue playback"></canvas></div>
      <div class="controls">
        <button id="prev" aria-label="Previous chapter">⏮</button>
        <button id="play" aria-label="Play">Play</button>
        <button id="next" aria-label="Next chapter">⏭</button>
        <div class="scrub-wrap">
          <input id="scrub" type="range" min="0" value="0" aria-label="Playback position">
          <div id="marks"></div>
        </div>
        <span id="time">0:00 / 0:00</span>
        <button id="mute" aria-pressed="false">Mute</button>
      </div>
      <div id="chapter"></div>
    </section>
    <aside>
      <h2>Chapters</h2>
      <ol id="chapters"></ol>
      <div class="keys">Space play/pause · ←/→ 5 s · [ ] chapter · Home/End</div>
    </aside>
  </main>
  <script src="player.js"></script>
</body>
</html>
